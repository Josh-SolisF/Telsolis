// Telsolis: servidor DHCPv4 (Kea) para la WAN simulada "telsolis-wan"
{
  "Dhcp4": {
    // Escuchar solo en la interfaz de la red interna, con sockets raw
    // (necesarios para responder a equipos que todavia no tienen IP)
    "interfaces-config": {
      "interfaces": [ "enp0s9" ],
      "dhcp-socket-type": "raw"
    },

    // Prestamos (leases) guardados en archivo, dentro de un volumen
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "lfc-interval": 3600
    },

    // Duracion del prestamo: 1 hora; renovar a los 15 min
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,

    "subnet4": [
      {
        "id": 1,
        "subnet": "10.20.0.0/24",
        "pools": [ { "pool": "10.20.0.100 - 10.20.0.200" } ],
        "option-data": [
          { "name": "routers", "data": "10.20.0.1" },
          { "name": "domain-name-servers", "data": "192.168.56.10" },
          { "name": "domain-name", "data": "telsolis.test" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ]
  }
}
