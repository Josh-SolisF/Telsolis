# Telsolis: Samba como servidor independiente, una carpeta compartida
[global]
   workgroup = TELSOLIS
   server string = Telsolis FileServer
   server role = standalone server
   map to guest = never
   server min protocol = SMB2
   disable netbios = yes
   smb ports = 445

[compartido]
   path = /srv/compartido
   read only = no
   valid users = telsolis-smb
   create mask = 0664
   directory mask = 0775
