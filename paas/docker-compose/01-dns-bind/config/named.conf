options {
    directory "/var/cache/bind";
    listen-on { any; };
    allow-query { any; };
    recursion yes;
    allow-recursion { 127.0.0.1; 192.168.0.0/16; };
    forwarders { 8.8.8.8; 1.1.1.1; };
    dnssec-validation auto;
};

zone "telsolis.test" {
    type primary;
    file "/etc/bind/zones/db.telsolis.test";
};
