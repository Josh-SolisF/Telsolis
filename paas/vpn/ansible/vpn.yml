# Telsolis - Fase 4: configuración del servidor OpenVPN en AWS
#
# Dos instancias de OpenVPN, ambas por TCP:
#   - tap (TCP 1194): computadora, interfaz TAP (lo que pide el enunciado)
#   - tun (TCP 1195): teléfono, interfaz TUN (Android/iOS no soportan TAP; autorizado por el profesor)
# Todo el tráfico de los clientes sale a internet por este servidor (redirect-gateway + NAT).
#
# La PKI (CA de la VPN y certificados) se crea UNA sola vez en la máquina que corre Ansible
# (la VM docker), fuera del repositorio, en {{ pki_local }}. Cada servidor nuevo recibe una copia,
# así los perfiles .ovpn siguen sirviendo aunque el servidor se destruya y se vuelva a crear.
#
# Requisitos en la VM docker:  sudo apt install -y easy-rsa openvpn
# Uso:                         ansible-playbook vpn.yml

- name: Servidor OpenVPN Telsolis
  hosts: vpn
  become: true
  gather_facts: false

  vars:
    pki_local: "{{ lookup('env', 'HOME') }}/telsolis-vpn-pki"
    pki_dir: /etc/openvpn/server/pki
    vpn_redes: 10.8.0.0/16
    vpn_instancias:
      - nombre: tap
        dev: tap
        puerto: 1194
        red: 10.8.1.0
        cliente: pc
      - nombre: tun
        dev: tun
        puerto: 1195
        red: 10.8.2.0
        cliente: telefono
    # Perfiles de cliente. ruta_todo: true = todo el tráfico sale por AWS (PC y teléfono).
    # "web" (Fase 5) es la VM del WordPress: solo usa el túnel para recibir las visitas
    # que llegan a telsolis.tech, con IP fija dentro del túnel.
    vpn_perfiles:
      - { cliente: pc, dev: tap, puerto: 1194, ruta_todo: true }
      - { cliente: telefono, dev: tun, puerto: 1195, ruta_todo: true }
      - { cliente: web, dev: tun, puerto: 1195, ruta_todo: false }
    web_tunel_ip: 10.8.2.200

  handlers:
    - name: Aplicar sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Reiniciar OpenVPN
      ansible.builtin.systemd:
        name: "openvpn-server@{{ item.nombre }}"
        state: restarted
      loop: "{{ vpn_instancias }}"

  tasks:
    # --- PKI local (VM docker): se crea una sola vez ------------------------
    - name: Revisar que easy-rsa y openvpn estén instalados en la VM docker
      ansible.builtin.command: which make-cadir openvpn
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true

    - name: Crear el directorio local de easy-rsa (fuera del repo)
      ansible.builtin.command: make-cadir {{ pki_local }}
      args:
        creates: "{{ pki_local }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Inicializar la PKI
      ansible.builtin.command: ./easyrsa init-pki
      args:
        chdir: "{{ pki_local }}"
        creates: "{{ pki_local }}/pki"
      environment:
        EASYRSA_BATCH: "1"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Crear la CA de la VPN
      ansible.builtin.command: ./easyrsa build-ca nopass
      args:
        chdir: "{{ pki_local }}"
        creates: "{{ pki_local }}/pki/ca.crt"
      environment:
        EASYRSA_BATCH: "1"
        EASYRSA_REQ_CN: "Telsolis VPN CA"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Crear el certificado del servidor
      ansible.builtin.command: ./easyrsa build-server-full server nopass
      args:
        chdir: "{{ pki_local }}"
        creates: "{{ pki_local }}/pki/issued/server.crt"
      environment:
        EASYRSA_BATCH: "1"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Crear los certificados de los clientes
      ansible.builtin.command: ./easyrsa build-client-full {{ item.cliente }} nopass
      args:
        chdir: "{{ pki_local }}"
        creates: "{{ pki_local }}/pki/issued/{{ item.cliente }}.crt"
      environment:
        EASYRSA_BATCH: "1"
      loop: "{{ vpn_perfiles }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Crear la llave tls-crypt (cifra y autentica el canal de control)
      ansible.builtin.command: openvpn --genkey secret {{ pki_local }}/pki/ta.key
      args:
        creates: "{{ pki_local }}/pki/ta.key"
      delegate_to: localhost
      become: false
      run_once: true

    # --- Preparación del servidor -------------------------------------------
    - name: Esperar a que el servidor acepte SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Esperar a que cloud-init termine el primer arranque
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    - name: Recolectar datos del servidor (interfaz de red, etc.)
      ansible.builtin.setup:

    - name: Instalar OpenVPN e iptables
      ansible.builtin.apt:
        name: [openvpn, iptables]
        update_cache: true
        lock_timeout: 300

    - name: Activar el reenvío de paquetes IPv4 (el servidor rutea a los clientes)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-telsolis-vpn.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: "0644"
      notify: Aplicar sysctl

    - name: Crear el directorio de llaves del servidor
      ansible.builtin.file:
        path: "{{ pki_dir }}"
        state: directory
        mode: "0700"

    - name: Copiar CA, certificado, llave del servidor y tls-crypt desde la VM docker
      ansible.builtin.copy:
        src: "{{ pki_local }}/pki/{{ item.origen }}"
        dest: "{{ pki_dir }}/{{ item.destino }}"
        mode: "0600"
      loop:
        - { origen: ca.crt, destino: ca.crt }
        - { origen: issued/server.crt, destino: server.crt }
        - { origen: private/server.key, destino: server.key }
        - { origen: ta.key, destino: ta.key }
      notify: Reiniciar OpenVPN

    # --- Servidores OpenVPN y NAT -------------------------------------------
    - name: Directorio de configuración por cliente (IP fija de la VM web en el túnel)
      ansible.builtin.file:
        path: /etc/openvpn/server/ccd
        state: directory
        mode: "0755"

    - name: IP fija para la VM web dentro del túnel TUN
      ansible.builtin.copy:
        dest: /etc/openvpn/server/ccd/web
        content: "ifconfig-push {{ web_tunel_ip }} 255.255.255.0\n"
        mode: "0644"

    - name: Configuración de cada instancia de OpenVPN
      ansible.builtin.template:
        src: servidor.conf.j2
        dest: "/etc/openvpn/server/{{ item.nombre }}.conf"
        mode: "0644"
      loop: "{{ vpn_instancias }}"
      notify: Reiniciar OpenVPN

    - name: Servicio de NAT de los clientes hacia internet
      ansible.builtin.template:
        src: telsolis-vpn-nat.service.j2
        dest: /etc/systemd/system/telsolis-vpn-nat.service
        mode: "0644"

    - name: Activar el NAT
      ansible.builtin.systemd:
        name: telsolis-vpn-nat
        enabled: true
        state: started
        daemon_reload: true

    - name: Activar las instancias de OpenVPN
      ansible.builtin.systemd:
        name: "openvpn-server@{{ item.nombre }}"
        enabled: true
        state: started
      loop: "{{ vpn_instancias }}"

    # --- Perfiles de los clientes (.ovpn) -----------------------------------
    - name: Crear la carpeta local de perfiles
      ansible.builtin.file:
        path: "{{ playbook_dir }}/clientes"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Generar los perfiles .ovpn
      ansible.builtin.template:
        src: cliente.ovpn.j2
        dest: "{{ playbook_dir }}/clientes/{{ item.cliente }}-{{ item.dev }}.ovpn"
        mode: "0600"
      loop: "{{ vpn_perfiles }}"
      loop_control:
        label: "{{ item.cliente }}-{{ item.dev }}.ovpn"
      delegate_to: localhost
      become: false
