# Telsolis - configuración de Ansible para la VPN
[defaults]
inventory = inventario.ini
# El servidor se recrea con frecuencia (cambia su llave de host); es un laboratorio.
host_key_checking = False
retry_files_enabled = False

[ssh_connection]
ssh_args = -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
