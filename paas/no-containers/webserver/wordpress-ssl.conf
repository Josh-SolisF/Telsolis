# Telsolis: WordPress en la VM web, con cifrado (puerto 443)
# Certificado firmado por la CA propia "Telsolis Root CA" (VM docker)
<VirtualHost *:443>
    ServerName web.telsolis.test
    DocumentRoot /var/www/wordpress

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/web.telsolis.test.crt
    SSLCertificateKeyFile /etc/ssl/private/web.telsolis.test.key

    <Directory /var/www/wordpress>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/wordpress_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/wordpress_ssl_access.log combined
</VirtualHost>
