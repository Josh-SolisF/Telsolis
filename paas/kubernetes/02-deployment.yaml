# WordPress (imagen oficial) usando como base de datos el MySQL en Docker Compose de la VM docker.
# Kubernetes mantiene siempre "replicas" copias corriendo: si una falla, la recrea.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      # Resolver mysql.telsolis.test sin depender del DNS que hereda el clúster
      # (la VM tiene también el DNS del NAT de VirtualBox, que no conoce telsolis.test).
      hostAliases:
        - ip: "192.168.56.10"
          hostnames: ["mysql.telsolis.test"]
      containers:
        - name: wordpress
          image: wordpress:6-apache
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "mysql.telsolis.test:3306"
            - name: WORDPRESS_DB_NAME
              value: "wordpress_k8s"
            - name: WORDPRESS_DB_USER
              value: "wpk8s"
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: password
          volumeMounts:
            - name: archivos
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
          # Listo para recibir tráfico cuando Apache responde (antes de instalar, WordPress responde 302)
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Si deja de responder por más de ~1 minuto, Kubernetes reinicia el contenedor
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: archivos
          persistentVolumeClaim:
            claimName: wordpress-archivos
