; =============================================================================
;  confbridge.conf  -  Telsolis, cuarto de conferencias
;  Fase 2b. Se usa desde extensions.conf con:
;    ConfBridge(sala, perfil_de_sala, perfil_de_usuario, menú)
;
;  ConfBridge separa la configuración en tres tipos de perfil:
;    bridge  ->  cómo es la SALA (cuántos caben, cómo se mezcla el audio)
;    user    ->  cómo se comporta cada PARTICIPANTE al entrar y estar en ella
;    menu    ->  qué hace cada TECLA durante la conferencia
; =============================================================================


; ------------------------------------------------------------- perfil de sala --
[sala-telsolis]
type=bridge
max_members=10             ; máximo de participantes al mismo tiempo
mixing_interval=20         ; cada 20 ms Asterisk mezcla el audio de todos
internal_sample_rate=auto  ; la calidad de la mezcla se adapta a los participantes


; -------------------------------------------------------- perfil de usuario --
[participante]
type=user
announce_user_count=yes          ; al entrar dice cuántas personas hay en la sala
announce_only_user=yes           ; si entra primero, avisa que está solo
music_on_hold_when_empty=yes     ; música de espera mientras está solo en la sala
dsp_drop_silence=yes             ; no mezcla el ruido de fondo de quien no habla
talk_detection_events=no
dtmf_passthrough=no              ; las teclas son para el menú, no para los demás


; --------------------------------------------------------------------- menú --
; Las teclas se marcan durante la conferencia. El * evita que una tecla
; presionada por accidente active algo.
[menu-participante]
type=menu
*1=toggle_mute                   ; silenciar / quitar silencio al propio micrófono
*2=participant_count             ; escuchar cuántas personas hay en la sala
*3=leave_conference              ; salir de la conferencia
