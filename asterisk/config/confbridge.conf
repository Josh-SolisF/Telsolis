; =============================================================================
;  confbridge.conf  -  Telsolis, cuarto de conferencias
;
;    ConfBridge(sala, perfil_de_sala, perfil_de_usuario, menú)
; =============================================================================


; ------------------------------------------------------------- perfil de sala --
[perfil-sala]
type=bridge
max_members=10             ; máximo de participantes simultáneos
mixing_interval=20         ; intervalo de mezcla del audio (ms)
internal_sample_rate=auto  ; frecuencia de mezcla según los participantes


; ------------------------------------------------------ perfil de participante --
[perfil-participante]
type=user
announce_user_count=yes          ; anuncia cuántas personas hay al entrar
announce_only_user=yes           ; avisa si es el único en la sala
music_on_hold_when_empty=yes     ; música de espera mientras está solo
dsp_drop_silence=yes             ; no mezcla el ruido de quien no habla
talk_detection_events=no
dtmf_passthrough=no              ; las teclas no se envían a los demás


; ---------------------------------------------------------------------- menú --
[menu-conferencia]
type=menu
*1=toggle_mute                   ; silenciar o reactivar el micrófono propio
*2=participant_count             ; escuchar cuántas personas hay en la sala
*3=leave_conference              ; salir de la conferencia
