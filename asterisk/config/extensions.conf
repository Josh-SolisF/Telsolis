; =============================================================================
;  extensions.conf  -  Telsolis, plan de marcado (dialplan)
;
;  Plan de numeración:
;    1001-1002  extensiones (PC, celular)
;    600-601    pruebas (eco, audio)
;    7000-7002  modo del horario (automático, forzar abierto, forzar cerrado)
;    8000       sala de conferencias
;    8500       buzón de voz propio
;    9000       llamada externa simulada (entra al menú)
;    9001-9003  grabación de los audios del menú
;    2XXXXXXX-8XXXXXXX  llamadas salientes a Costa Rica por Ring.cr
; =============================================================================

[general]
static=yes
writeprotect=yes           ; impide que "dialplan save" sobrescriba este archivo

[globals]
SEGUNDOS_TIMBRE=20                            ; segundos que suena una extensión antes del buzón
HORARIO_ATENCION=08:00-17:00                  ; horario de atención...
DIAS_ATENCION=mon-fri                         ; ...de lunes a viernes
ZONA_HORARIA=America/Costa_Rica
DIR_AUDIOS=/var/lib/asterisk/sounds/telsolis  ; audios grabados del menú
MENU_MAX_INTENTOS=3                           ; repeticiones del menú antes de colgar
MENU_SEGUNDOS_ESPERA=5                        ; espera por una opción después del menú
TODOS_TELEFONOS=PJSIP/1001&PJSIP/1002         ; teléfonos de la opción 1
TODOS_BUZONES=1001@telsolis&1002@telsolis     ; buzones de la opción 1
NUMERO_PUBLICO=+50646008422                   ; número de Ring.cr en E.164 (+506XXXXXXXX)


; -----------------------------------------------------------------------------
;  internos: llamadas de los endpoints 1001 y 1002
; -----------------------------------------------------------------------------
[internos]

; 600 - Prueba de eco
exten => 600,1,NoOp(Prueba de eco desde ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 - Prueba de audio
exten => 601,1,NoOp(Prueba de audio desde ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; 1001-1002 - Llamada entre extensiones
exten => _100[1-2],1,NoOp(Llamada interna: ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(sub-llamar-extension,s,1(${EXTEN}))
 same => n,Hangup()

; 8500 - Buzón de voz de quien llama (solo pide el PIN)
exten => 8500,1,NoOp(Buzón de voz de ${CALLERID(num)})
 same => n,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@telsolis)
 same => n,Hangup()

; 8000 - Sala de conferencias (*1 silenciar, *2 participantes, *3 salir)
exten => 8000,1,NoOp(Sala de conferencias: entra ${CALLERID(all)})
 same => n,Answer()
 same => n,ConfBridge(telsolis,perfil-sala,perfil-participante,menu-conferencia)
 same => n,Hangup()

; 7000-7002 - Modo del horario, guardado en la AstDB
;   7000 = automático (HORARIO_ATENCION y DIAS_ATENCION)
;   7001 = siempre abierto
;   7002 = siempre cerrado (todo va al buzón)
exten => 7000,1,Gosub(sub-cambiar-horario,s,1(auto))
 same => n,Hangup()
exten => 7001,1,Gosub(sub-cambiar-horario,s,1(abierto))
 same => n,Hangup()
exten => 7002,1,Gosub(sub-cambiar-horario,s,1(cerrado))
 same => n,Hangup()

; 9000 - Llamada externa simulada: entra al menú principal
exten => 9000,1,NoOp(Simulación de llamada externa desde ${CALLERID(all)})
 same => n,Goto(menu-principal,s,1)

; 9001-9003 - Grabar los audios del menú (terminar con # o 4 s de silencio)
exten => 9001,1,Gosub(sub-grabar-audio,s,1(menu))
 same => n,Hangup()
exten => 9002,1,Gosub(sub-grabar-audio,s,1(opcion-invalida))
 same => n,Hangup()
exten => 9003,1,Gosub(sub-grabar-audio,s,1(despedida))
 same => n,Hangup()


; Llamadas salientes a números de Costa Rica (8 dígitos, formato E.164)
exten => _[2-8]XXXXXXX,1,NoOp(Llamada saliente de ${CALLERID(num)} a +506${EXTEN})
 same => n,Gosub(sub-llamar-afuera,s,1(+506${EXTEN}))
 same => n,Hangup()


; -----------------------------------------------------------------------------
;  desde-ringcr: llamadas que llegan por la troncal; todas van al menú
; -----------------------------------------------------------------------------
[desde-ringcr]
; El destino puede llegar como número (+506...) o como el usuario de la troncal
exten => _[0-9a-zA-Z+].,1,NoOp(Llamada entrante al ${EXTEN} desde ${CALLERID(num)})
 same => n,Goto(menu-principal,s,1)

exten => s,1,NoOp(Llamada entrante desde ${CALLERID(num)})
 same => n,Goto(menu-principal,s,1)


; -----------------------------------------------------------------------------
;  menu-principal: llamadas entrantes desde la red telefónica
;    1001-1002  llamar a la extensión directamente
;    1          sonar todos los teléfonos
;    2          celular
;    3          computadora
;  Quien llama no puede transferir (Dial con opción t, sin T).
; -----------------------------------------------------------------------------
[menu-principal]
exten => s,1,NoOp(Menú principal: llamada de ${CALLERID(all)})
 same => n,Set(TIMEOUT(digit)=3)                       ; espera entre dígitos de una extensión
 same => n,Set(INTENTOS_MENU=0)
 same => n,Answer()
 same => n,Wait(1)
 same => n(inicio),Set(INTENTOS_MENU=$[${INTENTOS_MENU} + 1])
 same => n,Background(${DIR_AUDIOS}/menu)              ; acepta teclas mientras suena
 same => n,WaitExten(${MENU_SEGUNDOS_ESPERA})

; Opción 1: suenan todos (espera TIMEOUT(digit) por si se marca 1001 o 1002)
exten => 1,1,NoOp(Menú: opción 1, sonar todos)
 same => n,Gosub(sub-llamar-todos,s,1)
 same => n,Hangup()

; Opción 2: celular
exten => 2,1,NoOp(Menú: opción 2, celular)
 same => n,Gosub(sub-llamar-extension,s,1(1002,t))
 same => n,Hangup()

; Opción 3: computadora
exten => 3,1,NoOp(Menú: opción 3, computadora)
 same => n,Gosub(sub-llamar-extension,s,1(1001,t))
 same => n,Hangup()

; Extensión marcada directamente
exten => _100[1-2],1,NoOp(Menú: extensión directa ${EXTEN})
 same => n,Gosub(sub-llamar-extension,s,1(${EXTEN},t))
 same => n,Hangup()

; Opción inválida
exten => i,1,NoOp(Menú: opción inválida ${INVALID_EXTEN})
 same => n,Playback(${DIR_AUDIOS}/opcion-invalida)
 same => n,Goto(reintentar,1)

; Tiempo agotado sin marcar
exten => t,1,NoOp(Menú: no se marcó ninguna opción)
 same => n,Goto(reintentar,1)

; Repite el menú hasta MENU_MAX_INTENTOS veces y luego cuelga
exten => reintentar,1,NoOp(Menú: intento ${INTENTOS_MENU} de ${MENU_MAX_INTENTOS})
 same => n,GotoIf($[${INTENTOS_MENU} < ${MENU_MAX_INTENTOS}]?s,inicio)
 same => n,Playback(${DIR_AUDIOS}/despedida)
 same => n,Hangup()


; =============================================================================
;  SUBRUTINAS
; =============================================================================

; -----------------------------------------------------------------------------
;  sub-revisar-horario
;  Deja ESTADO_HORARIO en "abierto" o "cerrado" según el modo guardado
;  (7000-7002) o, en modo automático, según la hora actual.
; -----------------------------------------------------------------------------
[sub-revisar-horario]
exten => s,1,Set(MODO_HORARIO=${DB(telsolis/horario)})
 same => n,GotoIf($["${MODO_HORARIO}" = "abierto"]?abierto)
 same => n,GotoIf($["${MODO_HORARIO}" = "cerrado"]?cerrado)
 same => n,GotoIfTime(${HORARIO_ATENCION},${DIAS_ATENCION},*,*,${ZONA_HORARIA}?abierto)
 same => n(cerrado),Set(ESTADO_HORARIO=cerrado)
 same => n,NoOp(Fuera de horario)
 same => n,Return()
 same => n(abierto),Set(ESTADO_HORARIO=abierto)
 same => n,NoOp(Dentro de horario)
 same => n,Return()

; -----------------------------------------------------------------------------
;  sub-cambiar-horario(modo)
;  Guarda el modo (auto, abierto o cerrado) y confirma con un beep.
; -----------------------------------------------------------------------------
[sub-cambiar-horario]
exten => s,1,NoOp(Horario cambiado a modo: ${ARG1})
 same => n,Set(DB(telsolis/horario)=${ARG1})
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Return()

; -----------------------------------------------------------------------------
;  sub-llamar-extension(extensión[, opciones_dial])
;  Llama a la extensión respetando el horario. opciones_dial es tT por
;  defecto (ambos pueden transferir). Si nadie contesta, la llamada va al
;  buzón con el saludo de "ocupado" o de "no disponible".
; -----------------------------------------------------------------------------
[sub-llamar-extension]
exten => s,1,NoOp(Llamando a la extensión ${ARG1})
 same => n,Set(LOCAL(OPCIONES_DIAL)=${IF($["${ARG2}" = ""]?tT:${ARG2})})
 same => n,Gosub(sub-revisar-horario,s,1)
 same => n,GotoIf($["${ESTADO_HORARIO}" = "cerrado"]?no-disponible)
 same => n,Set(__TRANSFER_CONTEXT=internos)            ; destinos de transferencia en internos
 same => n,Dial(PJSIP/${ARG1},${SEGUNDOS_TIMBRE},${OPCIONES_DIAL})
 same => n,NoOp(Resultado: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n(no-disponible),VoiceMail(${ARG1}@telsolis,u)   ; saludo "no disponible"
 same => n,Goto(fin)
 same => n(ocupado),VoiceMail(${ARG1}@telsolis,b)         ; saludo "ocupado"
 same => n(fin),Return()

; -----------------------------------------------------------------------------
;  sub-llamar-todos
;  Hace sonar TODOS_TELEFONOS a la vez; contesta el primero. Si nadie contesta,
;  el mensaje se guarda en TODOS_BUZONES.
; -----------------------------------------------------------------------------
[sub-llamar-todos]
exten => s,1,NoOp(Llamando a todos: ${TODOS_TELEFONOS})
 same => n,Gosub(sub-revisar-horario,s,1)
 same => n,GotoIf($["${ESTADO_HORARIO}" = "cerrado"]?no-disponible)
 same => n,Set(__TRANSFER_CONTEXT=internos)
 same => n,Dial(${TODOS_TELEFONOS},${SEGUNDOS_TIMBRE},t)
 same => n,NoOp(Resultado: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)
 same => n(no-disponible),VoiceMail(${TODOS_BUZONES},u)
 same => n(fin),Return()

; -----------------------------------------------------------------------------
;  sub-grabar-audio(nombre)
;  Graba ${DIR_AUDIOS}/nombre.wav (máximo 30 s) y lo reproduce.
; -----------------------------------------------------------------------------
[sub-grabar-audio]
exten => s,1,NoOp(Grabando ${DIR_AUDIOS}/${ARG1}.wav)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Record(${DIR_AUDIOS}/${ARG1}.wav,4,30)
 same => n,Wait(1)
 same => n,Playback(${DIR_AUDIOS}/${ARG1})
 same => n,Return()

; -----------------------------------------------------------------------------
;  sub-llamar-afuera(número_e164)
;  Llama a un número externo por la troncal de Ring.cr, mostrando
;  NUMERO_PUBLICO como identificador de llamada si está definido.
; -----------------------------------------------------------------------------
[sub-llamar-afuera]
exten => s,1,NoOp(Llamando por Ring.cr a ${ARG1})
 same => n,ExecIf($["${NUMERO_PUBLICO}" != ""]?Set(CALLERID(num)=${NUMERO_PUBLICO}))
 same => n,Dial(PJSIP/${ARG1}@ringcr,60)
 same => n,NoOp(Resultado: ${DIALSTATUS})
 same => n,Return()
