; =============================================================================
;  extensions.conf  -  Telsolis, plan de marcado (dialplan)
;  Fase 1: pruebas y llamadas entre extensiones internas.
;  Fase 2a: buzón de voz y horario de atención.
; =============================================================================
;
;  Sintaxis básica:
;    exten => NÚMERO,PRIORIDAD,Aplicación(argumentos)
;     same => n,OtraAplicación()      ; "n" = siguiente prioridad, misma extensión
;     same => n(etiqueta),App()       ; paso con nombre, para saltar a él
;
;  Patrones (empiezan con _):
;    X = 0-9   Z = 1-9   N = 2-9   [1-2] = rango   . = uno o más de cualquiera
;    _100[1-2] coincide con 1001 y 1002.
;
;  Plan de numeración de Telsolis:
;    1001-1002  extensiones (PC, celular)
;    600-601    pruebas (eco, audio)
;    7000-7002  modo del horario (automático, forzar abierto, forzar cerrado)
;    8500       revisar el buzón de voz propio
;    8000       sala de conferencias          (fase 2b)
; =============================================================================

[general]
static=yes
writeprotect=yes           ; impide que "dialplan save" sobrescriba este archivo

[globals]
TIMEOUT_TIMBRE=20          ; segundos que suena una extensión antes del buzón
HORA_ATENCION=08:00-17:00  ; horario en que se contestan llamadas...
DIAS_ATENCION=mon-fri      ; ...de lunes a viernes
ZONA_HORARIA=America/Costa_Rica


; -----------------------------------------------------------------------------
;  Contexto "internos": aquí entran las llamadas de los endpoints 1001 y 1002
;  (por la línea context=internos de pjsip.conf).
; -----------------------------------------------------------------------------
[internos]

; 600 - Prueba de eco: lo que se dice se escucha de vuelta.
exten => 600,1,NoOp(Prueba de eco desde ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 601 - Reproduce un audio: prueba que el audio Asterisk -> teléfono funciona.
exten => 601,1,NoOp(Prueba de audio desde ${CALLERID(all)})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; 1001-1002 - Llamada entre extensiones.
;   Ya no se hace Dial() aquí directamente: se llama a la subrutina
;   sub-llamar-extension, que revisa el horario y maneja el buzón de voz.
;   La misma subrutina la va a usar el menú de la fase 2 (opciones 2 y 3).
exten => _100[1-2],1,NoOp(Llamada interna: ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(sub-llamar-extension,s,1(${EXTEN}))
 same => n,Hangup()

; 8500 - Revisar el buzón propio. Asterisk toma el número de quien llama
;        (${CALLERID(num)}) como buzón y solo pide el PIN.
exten => 8500,1,NoOp(Buzón de voz de ${CALLERID(num)})
 same => n,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@telsolis)
 same => n,Hangup()

; 7000-7002 - Modo del horario, guardado en la base de datos interna de
;   Asterisk (AstDB). Sirve para demostrar ambos casos en la revisión sin
;   esperar a que cambie la hora ni editar archivos.
;     7000 = automático (según HORA_ATENCION y DIAS_ATENCION)
;     7001 = forzar "abierto"  (siempre se contesta)
;     7002 = forzar "cerrado"  (todo va directo al buzón)
exten => 7000,1,Gosub(sub-cambiar-horario,s,1(auto))
 same => n,Hangup()
exten => 7001,1,Gosub(sub-cambiar-horario,s,1(abierto))
 same => n,Hangup()
exten => 7002,1,Gosub(sub-cambiar-horario,s,1(cerrado))
 same => n,Hangup()


; =============================================================================
;  SUBRUTINAS
;  Se ejecutan con Gosub(nombre,s,1(argumentos)) y regresan con Return().
;  Dentro de la subrutina, los argumentos se leen como ${ARG1}, ${ARG2}...
; =============================================================================

; -----------------------------------------------------------------------------
;  sub-horario: decide si estamos en horario de atención.
;  Resultado: deja la variable HORARIO en "abierto" o "cerrado".
; -----------------------------------------------------------------------------
[sub-horario]
exten => s,1,Set(MODO=${DB(telsolis/horario)})        ; leer el modo guardado
 same => n,GotoIf($["${MODO}" = "abierto"]?abierto)    ; ¿forzado abierto?
 same => n,GotoIf($["${MODO}" = "cerrado"]?cerrado)    ; ¿forzado cerrado?
 ; Modo automático (o nunca configurado): decide la hora actual.
 ; GotoIfTime(horas,días_semana,días_mes,meses,zona?etiqueta_si_coincide)
 same => n,GotoIfTime(${HORA_ATENCION},${DIAS_ATENCION},*,*,${ZONA_HORARIA}?abierto)
 same => n(cerrado),Set(HORARIO=cerrado)
 same => n,NoOp(Fuera de horario)
 same => n,Return()
 same => n(abierto),Set(HORARIO=abierto)
 same => n,NoOp(Dentro de horario)
 same => n,Return()

; -----------------------------------------------------------------------------
;  sub-cambiar-horario: guarda el modo del horario y confirma con un beep.
;  Uso:  Gosub(sub-cambiar-horario,s,1(auto|abierto|cerrado))
; -----------------------------------------------------------------------------
[sub-cambiar-horario]
exten => s,1,NoOp(Horario cambiado a modo: ${ARG1})
 same => n,Set(DB(telsolis/horario)=${ARG1})   ; guardar en la AstDB
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Return()

; -----------------------------------------------------------------------------
;  sub-llamar-extension: llama a una extensión respetando el horario.
;  Uso:  Gosub(sub-llamar-extension,s,1(1002))
;    - Fuera de horario: directo al buzón (saludo de "no disponible").
;    - En horario: suena TIMEOUT_TIMBRE segundos. Si contestan, listo.
;      Si está ocupado: buzón con saludo de "ocupado".
;      Si no contesta o no está conectado: buzón con saludo "no disponible".
; -----------------------------------------------------------------------------
[sub-llamar-extension]
exten => s,1,NoOp(Llamando a la extensión ${ARG1})
 same => n,Gosub(sub-horario,s,1)
 same => n,GotoIf($["${HORARIO}" = "cerrado"]?no-disponible)
 same => n,Dial(PJSIP/${ARG1},${TIMEOUT_TIMBRE})
 same => n,NoOp(Resultado: ${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?fin)   ; ya hablaron: terminar
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 ; NOANSWER, CHANUNAVAIL, etc. caen aquí:
 same => n(no-disponible),VoiceMail(${ARG1}@telsolis,u) ; u = saludo "no disponible"
 same => n,Goto(fin)
 same => n(ocupado),VoiceMail(${ARG1}@telsolis,b)       ; b = saludo "ocupado"
 same => n(fin),Return()
