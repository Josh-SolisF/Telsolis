; =============================================================================
;  pjsip.conf  -  Telsolis, endpoints SIP
;
;  Cada teléfono se define con tres objetos del mismo nombre:
;    endpoint  ->  comportamiento: códecs, contexto del dialplan, NAT
;    auth      ->  usuario y contraseña
;    aor       ->  dirección donde está registrado el teléfono
;  Las secciones marcadas con (!) son plantillas.
;
;  La troncal con Ring.cr usa además:
;    registration  ->  Asterisk se registra en el proveedor
;    identify      ->  reconoce las llamadas que llegan desde el proveedor
; =============================================================================


; ----------------------------------------------------------------- transporte --
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060          ; escuchar en todas las interfaces, puerto SIP estándar


; ----------------------------------------------------------------- plantillas --
[endpoint-interno](!)
type=endpoint
transport=transport-udp
context=internos           ; contexto de extensions.conf para sus llamadas
disallow=all
allow=ulaw                 ; G.711 mu-law
allow=alaw                 ; G.711 A-law
dtmf_mode=rfc4733          ; teclas enviadas como eventos RTP
direct_media=no            ; el audio siempre pasa por Asterisk
rtp_symmetric=yes          ; NAT: enviar RTP a la dirección de origen real
force_rport=yes            ; NAT: responder SIP al puerto de origen real
rewrite_contact=yes        ; NAT: registrar la dirección de origen real

[auth-interno](!)
type=auth
auth_type=userpass

[aor-interno](!)
type=aor
max_contacts=1             ; un dispositivo por extensión
remove_existing=yes        ; un registro nuevo reemplaza al anterior
qualify_frequency=30       ; verificar con OPTIONS cada 30 s


; ---------------------------------------------------------------- extensiones --
; 1001 - Linphone en la computadora
[1001](endpoint-interno)
auth=1001
aors=1001
callerid="PC" <1001>
mailboxes=1001@telsolis

[1001](aor-interno)

; 1002 - Linphone en el celular
[1002](endpoint-interno)
auth=1002
aors=1002
callerid="Celular" <1002>
mailboxes=1002@telsolis

[1002](aor-interno)


; ------------------------------------------------------------ troncal Ring.cr --
[ringcr]
type=endpoint
transport=transport-udp
context=desde-ringcr       ; llamadas entrantes desde la red telefónica
disallow=all
allow=ulaw
allow=alaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
outbound_auth=ringcr-auth  ; Asterisk se autentica ante el proveedor
aors=ringcr
from_user=dc768caf

[ringcr]
type=aor
contact=sip:148.227.162.40:5060
qualify_frequency=30       ; mantiene abierta la ruta a través del NAT

[ringcr]
type=identify
endpoint=ringcr
match=148.227.162.40

[ringcr]
type=registration
transport=transport-udp
outbound_auth=ringcr-auth
server_uri=sip:148.227.162.40:5060
client_uri=sip:dc768caf@148.227.162.40:5060
expiration=120             ; renovar el registro cada 2 minutos (NAT)
retry_interval=60          ; reintentar cada minuto si falla
forbidden_retry_interval=300
line=yes                   ; asocia las llamadas entrantes a este registro
endpoint=ringcr


; --------------------------------------------------------------- credenciales --
; Objetos auth de 1001, 1002 y de la troncal (archivo fuera del repositorio).
#include pjsip_auth.conf
