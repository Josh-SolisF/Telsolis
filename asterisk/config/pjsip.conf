; =============================================================================
;  pjsip.conf  -  Telsolis, Proyecto 2 (Central Telefónica)
;  Fase 1: dos endpoints internos (PC y celular) en la misma LAN.
;  La troncal de CallMyWay se agrega en la fase 3.
; =============================================================================
;
;  Cómo se relacionan los objetos de PJSIP:
;
;    transport  ->  por dónde escucha Asterisk (protocolo, IP y puerto)
;    endpoint   ->  "quién es" el teléfono: códecs, contexto del dialplan, NAT
;    auth       ->  usuario y contraseña con los que se autentica
;    aor        ->  "dónde está": guarda la IP:puerto con que el teléfono
;                   se registró (Address Of Record)
;
;  Un teléfono = 1 endpoint + 1 auth + 1 aor. Por convención los tres llevan
;  el mismo nombre (1001); PJSIP lo permite porque son tipos distintos.
;
;  Las secciones marcadas con (!) son PLANTILLAS: no crean nada por sí solas,
;  solo agrupan opciones que heredan las secciones que dicen (nombre-plantilla).
; =============================================================================


; ---------------------------------------------------------------- transporte --
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060          ; escuchar en todas las interfaces, puerto SIP estándar


; ----------------------------------------------------------------- plantillas --
[endpoint-interno](!)
type=endpoint
transport=transport-udp
context=internos           ; contexto de extensions.conf donde entran SUS llamadas
disallow=all               ; primero se quitan todos los códecs...
allow=ulaw                 ; ...y se permiten solo G.711 (los soporta cualquier
allow=alaw                 ;    softphone y no requiere módulos extra)
dtmf_mode=rfc4733          ; teclas del menú enviadas como eventos RTP (RFC 4733)
direct_media=no            ; el audio SIEMPRE pasa por Asterisk (necesario para
                           ; transferencias, grabación y NAT)
rtp_symmetric=yes          ; responder el RTP a donde realmente llega (NAT)
force_rport=yes            ; responder SIP al puerto de origen real (NAT)
rewrite_contact=yes        ; guardar la IP:puerto real del registro (NAT)

[auth-interno](!)
type=auth
auth_type=userpass

[aor-interno](!)
type=aor
max_contacts=1             ; un dispositivo registrado por extensión
remove_existing=yes        ; si se vuelve a registrar, reemplaza al anterior
qualify_frequency=30       ; enviar OPTIONS cada 30 s para saber si sigue vivo


; -------------------------------------------------------------- extensiones --
; Los objetos "auth" (con las contraseñas) viven en pjsip_auth.conf, que NO
; se sube al repo. Ver pjsip_auth.conf.example.

; 1001 - Linphone en la computadora
[1001](endpoint-interno)
auth=1001
aors=1001
callerid="PC" <1001>
mailboxes=1001@telsolis    ; buzón de voz asociado (se usa en la fase 2)

[1001](aor-interno)

; 1002 - Linphone en el celular
[1002](endpoint-interno)
auth=1002
aors=1002
callerid="Celular" <1002>
mailboxes=1002@telsolis

[1002](aor-interno)


; ----------------------------------------------------------- credenciales --
#include pjsip_auth.conf
