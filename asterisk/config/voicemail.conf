[general]
format=wav49|wav           ; formatos en que se guarda cada mensaje
maxmsg=100                 ; máximo de mensajes por buzón
maxsecs=180                ; duración máxima de un mensaje (segundos)
minsecs=2                  ; se descartan los mensajes más cortos
maxlogins=3                ; intentos de PIN antes de cortar la llamada
review=yes                 ; permite escuchar y regrabar el mensaje antes de colgar

; Buzones 1001 y 1002 con su PIN (archivo fuera del repositorio).
#include voicemail_buzones.conf
