; =============================================================================
;  voicemail.conf  -  Telsolis, buzón de voz
;  Fase 2a. Los buzones (con sus PIN) viven en voicemail_buzones.conf, que NO
;  se sube al repo. Ver voicemail_buzones.conf.example.
; =============================================================================

[general]
format=wav49|wav           ; formatos en que se guarda cada mensaje grabado
maxmsg=100                 ; máximo de mensajes por buzón
maxsecs=180                ; duración máxima de un mensaje (segundos)
minsecs=2                  ; mensajes más cortos se descartan (cuelgues rápidos)
maxlogins=3                ; intentos de PIN antes de cortar la llamada
review=yes                 ; quien deja el mensaje puede escucharlo y regrabarlo
                           ; antes de colgar (presionando # al terminar)
; Envío de mensajes por correo: se activa cuando exista el servicio de email
; de Docker (integración con el examen PaaS).
;attach=yes
;serveremail=buzon@telsolis.test

#include voicemail_buzones.conf
