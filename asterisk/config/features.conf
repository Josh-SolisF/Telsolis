; =============================================================================
;  features.conf  -  Telsolis, transferencias de llamadas
;
;  Teclas disponibles durante una llamada hecha con Dial(..., t) o Dial(..., T).
; =============================================================================

[general]
transferdigittimeout=6     ; segundos de espera para cada dígito del destino
atxfernoanswertimeout=15   ; segundos que suena el destino en la consultada
atxferdropcall=no          ; si el destino no contesta, se vuelve a la llamada original
xfersound=beep             ; sonido de transferencia completada
xferfailsound=beeperr      ; sonido de transferencia fallida


[featuremap]
blindxfer => #1            ; transferencia ciega:      #1 + número del destino
atxfer => *2               ; transferencia consultada: *2 + número del destino
