; =============================================================================
;  features.conf  -  Telsolis, transferencias de llamadas
;  Fase 2c. Define las teclas que Asterisk escucha DURANTE una llamada.
;  Solo funcionan en llamadas hechas con Dial(...,tT): ver
;  sub-llamar-extension en extensions.conf.
;
;  Dos tipos de transferencia:
;    ciega      (blind)    -> se marca el destino y se cuelga de inmediato;
;                             quien estaba en la llamada pasa directo al destino.
;    consultada (attended) -> primero se habla con el destino y, al colgar,
;                             se unen las otras dos personas.
; =============================================================================

[general]
transferdigittimeout=3     ; segundos de espera entre dígitos del destino
atxfernoanswertimeout=15   ; en la consultada, segundos que suena el destino
atxferdropcall=no          ; si el destino no contesta, se vuelve a la llamada original
xfersound=beep             ; sonido cuando la transferencia se completa
xferfailsound=beeperr      ; sonido cuando la transferencia falla


[featuremap]
blindxfer => #1            ; transferencia ciega:      #1 + número del destino
atxfer => *2               ; transferencia consultada: *2 + número del destino
